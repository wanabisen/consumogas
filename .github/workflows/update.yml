name: Actualizar dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/**.xlsx"
      - "scripts/process.py"
  workflow_dispatch:

permissions:
  contents: write

# Si se suben dos Excel seguidos, se cancela la ejecución antigua
concurrency:
  group: actualizar-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Procesar Excel
        run: python scripts/process.py

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "data.json sin cambios"
            exit 0
          fi
          git commit -m "chore: actualizar data.json"
          git pull --rebase origin main
          git push
